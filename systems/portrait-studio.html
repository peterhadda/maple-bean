<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maple Bean · portrait studio</title>
<!-- Capture tool, not a game screen. Renders one cast member head-and-shoulders
     on a transparent background so qa/portraits.mjs can save a cutout PNG for
     the dialogue portraits. The characters come from the live runtime, so a
     re-render always reflects the café as it is now. -->
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<style>
  html, body { margin: 0; height: 100%; background: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { createMaya, loadCharacters } from '/assets/characters/runtime.js';
import { cast } from '/characters.js';

const params = new URLSearchParams(location.search);
const id = Object.hasOwn(cast, params.get('who')) ? params.get('who') : 'maya';
const expression = params.get('expression') || 'smile';
// 'bust' is the dialogue framing: head and shoulders. 'full' is a turnaround.
const shot = params.get('shot') || 'bust';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearAlpha(0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.24;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.append(renderer.domElement);

const scene = new THREE.Scene();
// The creator's lighting rig, so a portrait matches the character preview.
scene.add(new THREE.HemisphereLight('#fff3db', '#9e8263', 2.2));
const key = new THREE.DirectionalLight('#fff0db', 3.2); key.position.set(-3, 5, 4); scene.add(key);
const fill = new THREE.DirectionalLight('#e2ebff', 1.4); fill.position.set(3, 2, -2); scene.add(fill);
const rim = new THREE.DirectionalLight('#ffe6c4', 1.1); rim.position.set(1.4, 3, -3.4); scene.add(rim);

const camera = new THREE.PerspectiveCamera(shot === 'bust' ? 26 : 38, innerWidth / innerHeight, .02, 20);

await loadCharacters();
const avatar = createMaya({ ...cast[id] });
scene.add(avatar.group);
// A slight turn reads warmer than dead-on, and matches the tour's staging.
avatar.group.rotation.y = Number(params.get('turn') ?? 0.24);

function frame() {
  const height = shot === 'bust' ? 1.36 : .86;
  const distance = shot === 'bust' ? 1.55 : 2.85;
  camera.position.set(0, height, distance);
  camera.lookAt(0, height, 0);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
frame();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); frame(); });

// Settle the procedural idle, then hold perfectly still for the capture.
for (let i = 0; i < 40; i++) avatar.update(i * .016, .016, { still: true, expression });
avatar.update(0, 0, { still: true, expression });
renderer.render(scene, camera);
window.__ready = true;

// Keep it live so a human can open this page and look around.
if (params.get('live') === '1') {
  let t = 0;
  renderer.setAnimationLoop(() => { t += .016; avatar.update(t, .016, { expression }); renderer.render(scene, camera); });
}
</script>
</body>
</html>
